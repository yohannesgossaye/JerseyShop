version: "2"

sql:
  - engine: "postgresql"
    queries: ../../query/customers.sql
    schema: "./migration"
    gen:
      go:
        package: "gen"
        out: ../../../internal/persistence/postgres/customeraccount/gen
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_exported_queries: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - column: "customers.id"
            go_type: "int"
          - column: "customers.created_at"
            go_type: "time.Time"
          - column: "customers.updated_at"
            go_type: "time.Time"
          - column: "customers.otp_expires_at"
            go_type: "time.Time"
