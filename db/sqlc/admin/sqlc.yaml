version: "2"
sql:
  - schema: db/migration
    queries: db/query
    engine: postgresql
    gen:
      go:
        package: gen
        out: "../internal/persistence/postgres/admin/gen"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        json_tags_case_style: snake
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

